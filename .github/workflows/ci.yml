name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: kubequiz
  APP_VERSION: "1.0.0"

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: flake8 kubequiz tests
      - run: pytest -v

  infra-lint:
    name: Validate K8s / Ansible / shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kubeconform (strict, K8s schemas)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -summary -strict -skip ServiceMonitor k8s/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ansible syntax check + lint
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        run: |
          pip install ansible-core==2.18.20 kubernetes==37.0.2 ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml
          cd ansible
          for p in site.yml teardown.yml scale-demo.yml; do ansible-playbook --syntax-check "$p"; done
          ansible-lint --offline site.yml teardown.yml scale-demo.yml roles
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: Grafana dashboard is valid JSON
        run: python -m json.tool monitoring/dashboard-kubequiz.json >/dev/null

  e2e:
    name: E2E on a kind cluster
    needs: [test, infra-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg "APP_VERSION=${APP_VERSION}" -t "kubequiz:${APP_VERSION}" app
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kubequiz
      - name: Load image into kind
        run: kind load docker-image "kubequiz:${APP_VERSION}" --name kubequiz
      - name: Smoke test
        run: bash scripts/e2e-smoke.sh

  publish:
    name: Build & push image (GHCR)
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.APP_VERSION }}
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
