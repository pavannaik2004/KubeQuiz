---
# Build the app image with the host's Docker (Docker Desktop) and load it into
# minikube, so no registry is needed (D-012). minikube v1.39 uses containerd,
# where `minikube docker-env` is unsupported, hence build-then-load.
#
# Idempotency (D-034): the image ID is stable across cached rebuilds (no
# provenance/SBOM attestations). The image is (re)loaded into minikube only
# when the ID differs from the one the running Deployment was stamped with,
# or the cluster does not have the tag at all.

- name: Read the image ID the running Deployment was built from
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ app_namespace }}"
    name: quiz-app
  register: build_current_deploy

- name: Build the app image and load it into minikube as {{ app_image }}
  ansible.builtin.shell: |
    set -euo pipefail
    # No provenance/SBOM attestations: they embed a build timestamp, which
    # gives a new image ID on every build and breaks idempotency.
    docker build --quiet --provenance=false --sbom=false \
      --build-arg APP_VERSION={{ app_version }} \
      -t {{ app_image }} {{ repo_dir }}/app >/dev/null
    id="$(docker images -q --no-trunc {{ app_image }})"
    echo "IMAGE_ID=${id}"
    if [ "$id" != "{{ build_deployed_id }}" ] || \
       ! minikube -p {{ minikube_profile }} image ls | grep -Fxq "docker.io/library/{{ app_image }}"; then
      minikube -p {{ minikube_profile }} image load --overwrite=true {{ app_image }}
      echo "CHANGED"
    fi
  args:
    executable: /bin/bash
  vars:
    build_deployed_id: >-
      {{ (build_current_deploy.resources | first | default({}))
         .get('spec', {}).get('template', {}).get('metadata', {})
         .get('annotations', {}).get('kubequiz/image-id', 'none') }}
  register: build_result
  changed_when: "'CHANGED' in build_result.stdout_lines"

- name: Remember the image ID (used to roll pods when the image changes)
  ansible.builtin.set_fact:
    build_image_id: "{{ build_result.stdout_lines | select('match', '^IMAGE_ID=') | first | regex_replace('^IMAGE_ID=', '') }}"
