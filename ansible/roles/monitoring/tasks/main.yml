---
# Prometheus + Grafana via the kube-prometheus-stack Helm chart, a
# ServiceMonitor for the app and the KubeQuiz Grafana dashboard.

# The chart is pulled from the OCI registry on ghcr.io rather than the classic
# Helm repo, whose tarballs are GitHub release assets (they returned 504 /
# connection resets during the first live run, see D-033).
- name: Install kube-prometheus-stack {{ kps_chart_version }}
  kubernetes.core.helm:
    name: "{{ monitoring_release }}"
    chart_ref: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    chart_version: "{{ kps_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    # Passed inline (not values_files): with values_files the module cannot
    # tell "no change" without the helm-diff plugin and upgrades every run.
    values: >-
      {{ lookup('ansible.builtin.file', repo_dir + '/monitoring/values.yaml') | from_yaml
         | combine({'grafana': {'adminPassword': grafana_admin_password}}, recursive=true) }}
    wait: true
    timeout: 10m
  register: monitoring_helm
  until: monitoring_helm is succeeded
  retries: 4
  delay: 10

# Rendered through a template (YAML block scalar) on purpose: passing JSON
# text through a plain "{{ }}" value makes Ansible turn it into a dict.
- name: KubeQuiz Grafana dashboard (picked up by the Grafana sidecar)
  kubernetes.core.k8s:
    apply: true
    template: dashboard-configmap.yaml.j2

- name: ServiceMonitor for quiz-app
  kubernetes.core.k8s:
    src: "{{ k8s_dir }}/monitoring/servicemonitor.yaml"
    apply: true
