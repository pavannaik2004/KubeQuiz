# Distributed Locust: one master (web UI on :8089) + workers that generate
# the simulated students. The locustfile comes from the "locustfile"
# ConfigMap, which is built from loadtest/locustfile.py:
#   kubectl -n kubequiz create configmap locustfile --from-file=loadtest/locustfile.py
# (Ansible does this automatically in the loadtest role.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  namespace: kubequiz
  labels: {app.kubernetes.io/name: locust, app.kubernetes.io/component: master}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: locust, app.kubernetes.io/component: master}
  template:
    metadata:
      labels: {app.kubernetes.io/name: locust, app.kubernetes.io/component: master}
    spec:
      containers:
        - name: locust
          image: locustio/locust:2.31.8
          args:
            - -f
            - /mnt/locust/locustfile.py
            - --master
            - --host
            - http://quiz-app.kubequiz.svc.cluster.local
          ports:
            - {name: web, containerPort: 8089}
            - {name: comm, containerPort: 5557}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: locustfile, mountPath: /mnt/locust}
      volumes:
        - name: locustfile
          configMap: {name: locustfile}
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: kubequiz
  labels: {app.kubernetes.io/name: locust}
spec:
  selector: {app.kubernetes.io/name: locust, app.kubernetes.io/component: master}
  ports:
    - {name: web, port: 8089, targetPort: web}
    - {name: comm, port: 5557, targetPort: comm}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  namespace: kubequiz
  labels: {app.kubernetes.io/name: locust, app.kubernetes.io/component: worker}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: locust, app.kubernetes.io/component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: locust, app.kubernetes.io/component: worker}
    spec:
      containers:
        - name: locust
          image: locustio/locust:2.31.8
          args:
            - -f
            - /mnt/locust/locustfile.py
            - --worker
            - --master-host
            - locust-master
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - {name: locustfile, mountPath: /mnt/locust}
      volumes:
        - name: locustfile
          configMap: {name: locustfile}
