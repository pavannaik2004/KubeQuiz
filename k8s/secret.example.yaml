# Example only. Ansible creates the real Secret from ansible/group_vars/all.yml,
# so real values never live in this directory.
# Manual use:  kubectl apply -f k8s/secret.example.yaml
apiVersion: v1
kind: Secret
metadata:
  name: quiz-secret
  namespace: kubequiz
  labels:
    app.kubernetes.io/name: kubequiz
type: Opaque
stringData:
  # Must be identical for every replica (signed session cookies), see D-005.
  SECRET_KEY: change-me-to-a-long-random-string
  ADMIN_PASSWORD: admin123
