apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-app
  namespace: kubequiz
  labels:
    app.kubernetes.io/name: kubequiz
    app.kubernetes.io/component: web
spec:
  # No "replicas" here on purpose: the HorizontalPodAutoscaler (hpa.yaml)
  # owns the replica count (min 3, max 10). A fixed value here would be
  # reset on every re-apply and fight the autoscaler. See D-011.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: kubequiz
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0       # never drop below the current capacity during an update
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubequiz
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: kubequiz:1.0.0
          imagePullPolicy: IfNotPresent   # image is built inside minikube, see D-012
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: quiz-config
            - secretRef:
                name: quiz-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            # The HPA computes CPU utilisation relative to this request.
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              # Give the Service a moment to remove this pod from its
              # endpoints before gunicorn starts shutting down.
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: quiz-data
        - name: tmp
          emptyDir: {}
